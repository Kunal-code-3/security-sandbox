<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Security Sandbox</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header>
    <nav>
        <div class="logo">
            <i class="fa-solid fa-shield-halved"></i>
            Security Sandbox
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="features.html">Features</a></li>
            <li><a href="quiz.html">Quiz</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="auth.html" class="active">Sign In</a></li>
        </ul>
    </nav>
</header>

<section class="auth-page">
    <div class="auth-card">
        <div id="auth-message" class="auth-message"></div>

        <div class="auth-form active" id="signin-form">
            <h2>Hello Sir, Welcome</h2>
            <p>Access your security dashboard and continue learning.</p>

            <form id="form-signin">
                <label for="signin-email">Email</label>
                <input id="signin-email" type="email" placeholder="you@example.com" required>

                <label for="signin-password">Password</label>
                <input id="signin-password" type="password" placeholder="Enter your password" required>
                <div class="auth-actions">
                    <button type="submit" class="auth-submit">Sign In</button>
                    <button class="switch-btn" type="button" data-form="signup">Sign Up</button>
                </div>
            </form>

            <p class="auth-footer">
                New here? <a href="#" class="toggle-link" data-form="signup">Create an account</a>
            </p>
        </div>

        <div class="auth-form" id="signup-form">
            <h2>Create Account</h2>
            <p>Join Security Sandbox to start your cyber safety journey.</p>

            <form id="form-signup">
                <label for="signup-name">Full Name</label>
                <input id="signup-name" type="text" placeholder="Your name" required>

                <label for="signup-email">Email</label>
                <input id="signup-email" type="email" placeholder="you@example.com" required>

                <label for="signup-password">Password</label>
                <input id="signup-password" type="password" placeholder="Create a password" required>
                <div class="auth-actions">
                    <button type="submit" class="auth-submit">Sign Up</button>
                    <button class="switch-btn" type="button" data-form="signin">Sign In</button>
                </div>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="#" class="toggle-link" data-form="signin">Sign in</a>
            </p>
        </div>
    </div>
</section>

<script>
    const authKey = 'securitySandboxAuth';
    const userKey = 'securitySandboxUser';
    const msgBox = document.getElementById('auth-message');

    function showMessage(text, type = 'error') {
        msgBox.textContent = text;
        msgBox.className = `auth-message active ${type}`;
    }

    function clearMessage() {
        msgBox.textContent = '';
        msgBox.className = 'auth-message';
    }

    function setAuthenticated(user) {
        sessionStorage.setItem(authKey, 'true');
        localStorage.setItem(authKey, 'true');
        if (user) {
            sessionStorage.setItem(userKey, JSON.stringify(user));
            localStorage.setItem(userKey, JSON.stringify(user));
        }
    }

    const toggleButtons = document.querySelectorAll('.switch-btn, .toggle-link');
    const authForms = document.querySelectorAll('.auth-form');

    toggleButtons.forEach(button => {
        button.addEventListener('click', (event) => {
            event.preventDefault();
            clearMessage();
            const target = button.getAttribute('data-form');

            document.querySelectorAll('.switch-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-form') === target);
            });

            authForms.forEach(form => {
                form.classList.toggle('active', form.id === `${target}-form`);
            });
        });
    });

    // Handle Sign In
    document.getElementById('form-signin').addEventListener('submit', async (event) => {
        event.preventDefault();
        clearMessage();

        const email = document.getElementById('signin-email').value.trim();
        const password = document.getElementById('signin-password').value;

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (!response.ok) {
                showMessage(data.error || 'Login failed', 'error');
                return;
            }

            showMessage('Login successful! Redirecting...', 'success');
            setAuthenticated(data.user);
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        } catch (err) {
            console.error('Login error:', err);
            showMessage('Unable to connect to authentication server.', 'error');
        }
    });

    // Handle Sign Up
    document.getElementById('form-signup').addEventListener('submit', async (event) => {
        event.preventDefault();
        clearMessage();

        const name = document.getElementById('signup-name').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const password = document.getElementById('signup-password').value;

        try {
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });

            const data = await response.json();

            if (!response.ok) {
                showMessage(data.error || 'Registration failed', 'error');
                return;
            }

            showMessage('Account created successfully! Redirecting...', 'success');
            setAuthenticated(data.user);
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        } catch (err) {
            console.error('Registration error:', err);
        }
    });
</script>

<script src="auth-state.js"></script>
</body>
</html>
